name: Sync shared-main with main

# shared-main is flambeau's integration branch: they push their own commits there and later
# merge that branch onto main themselves, reviewed, as a normal PR. This workflow only moves in
# the other direction - it keeps shared-main current with main - and never touches main itself.
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shared-main
          fetch-depth: 0

      - name: Merge main into shared-main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin shared-main

      # Only reached if the merge step above failed - a real conflict between main and
      # shared-main, which nothing here should try to resolve. shared-main is left exactly as it
      # was; a person has to merge it by hand.
      - name: Email on conflict
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "shared-main sync failed - manual merge needed (${{ github.repository }})"
          to: SatyaNagaSai.DeepakVaranasi@taylorandfrancis.com,Abhishek.RNair@taylorandfrancis.com,Ashwin.Sudhakar@taylorandfrancis.com
          from: GitHub Actions <actions@taylorandfrancis.com>
          body: |
            Merging main into shared-main failed, most likely a real conflict between the two
            branches. shared-main has NOT been changed - nothing was pushed.

            main is now at ${{ github.sha }}.

            To fix it by hand:
              git fetch origin
              git checkout shared-main
              git merge origin/main
              # resolve conflicts
              git push origin shared-main

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
