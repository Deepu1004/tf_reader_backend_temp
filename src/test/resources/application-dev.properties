# application-dev.yml reads its jwt secret from ${TF_JWT_SECRET} with no default, so any test
# that activates the "dev" profile (AdminOpenApiTest) binds the unresolved literal
# "${TF_JWT_SECRET}" - 16 characters - as the secret when the env var isn't set, and HS256 needs
# at least 32 bytes. Profile-specific config always wins over the default application.properties
# value in this same directory, so the override has to live here, not there.
tf.security.jwt.secret=a-test-only-signing-secret-of-sufficient-length-0123456789
