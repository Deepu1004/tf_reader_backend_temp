# Test-wide defaults. Kept in application.properties rather than application.yml so that
# src/main/resources/application.yml is still loaded (a test application.yml would shadow it).
#
# common.security.JwtProperties refuses to start without this and has deliberately no default,
# reading it from the TF_JWT_SECRET env var in every real environment. A test-wide value here
# means the whole suite no longer depends on that env var happening to be set on whichever
# machine runs it; tests that care about the exact value still override it themselves. (This
# used to be two duplicate keys with two different values, left behind when auth.token's own
# JwtProperties was merged into this one - a plain .properties file resolves that as "last one
# wins" with no warning, so the first was silently dead.)
tf.security.jwt.secret=a-test-only-signing-secret-of-sufficient-length-0123456789

# CatalogueUrlBuilder's base URL, likewise no default now that it reads ${BASE_URL} in every
# real environment. A fixed test-wide value means an IT's assertion on the built catalogueUrl
# does not depend on .env, and does not have to match webEnvironment's random port - the base
# URL is a stable public address, not the ephemeral port a test happens to run on.
tf.catalogue.base-url=http://localhost:8080

# application.yml now reads server.port from ${SERVER_PORT} with no default, so every
# @SpringBootTest in the suite fails to even build its context on a machine without that env
# var set - not just the ones that bind a real port. 0 is Spring's own convention for "pick a
# free port," so this also can't collide between test JVMs running at once.
server.port=0

# Same commit also dropped the inline defaults for Redis and OIDC, both of which used to make a
# plain `mvn test` work without a full .env. Spring resolves an unset ${...} placeholder eagerly
# and fails the whole context. (Mongo doesn't need an entry here: spring.data.mongodb.uri is dead
# in this Spring Boot version - the real property is spring.mongodb.uri, which
# ContainerisedInfrastructure and HoldContainerTest already override via @DynamicPropertySource.)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# OIDC used to default to the mock values below inline in application.yml; now it doesn't, and
# nothing in the suite actually exercises real OIDC redirect/token URLs, so these just need to
# resolve to something rather than break every context that has security auto-configuration on
# the classpath.
tnf.auth.oidc.client-id=mock-client-id
tnf.auth.oidc.client-secret=mock-client-secret
tnf.auth.oidc.issuer=http://localhost:8080
tnf.auth.oidc.authorization-uri=http://localhost:8080/oauth2/v2.0/authorize
tnf.auth.oidc.token-uri=http://localhost:8080/oauth2/v2.0/token
tnf.auth.oidc.jwk-set-uri=http://localhost:8080/oauth2/v2.0/jwks
tnf.auth.oidc.redirect-uri=http://localhost:8080/api/v1/auth/oidc/callback

# application.yml now defaults this to true for local development. ContainerisedInfrastructure
# gives the whole test JVM one shared, never-restarted MongoDB container, so if seeding ran it
# would write real rows (RTLG, imperial, inst_7f3, ops@tandf.example...) that every plain
# repository test using those same example values as fresh inserts would then collide with -
# which is exactly what AdminUserRepositoryTest, BookCollectionRepositoryTest,
# EntitlementRepositoryTest, FeedSettingsRepositoryTest, InstitutionRepositoryTest and
# PublisherRepositoryTest did the moment this default turned on. The seeder is for a developer's
# own local database, not a shared test fixture.
tnf.seed.enabled=false
