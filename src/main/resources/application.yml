spring:
  application:
    name: reader
  data:
    mongodb:
      auto-index-creation: true

tf:
  security:
    jwt:
      issuer: tf-reader
      # No default. Startup fails fast when this is missing or shorter than 32 bytes.
      # Supply it via the TF_JWT_SECRET environment variable in every deployed environment.
      secret: ${TF_JWT_SECRET:}
      access-token-ttl: 15m
      refresh-token-ttl: 14d

# API documentation is off by default and enabled only by the dev profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
