spring:
  docker:
    compose:
      enabled: false
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: reader
  profiles:
    active: local
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 200ms
  security:
    saml2:
      relyingparty:
        registration:
          tf-reader:
            entity-id: tf-reader-sp
            acs:
              location: "{baseUrl}/login/saml2/sso/{registrationId}"
            assertingparty:
              entity-id: saml-mock
              singlesignon:
                url: ${SAML_URL}
                binding: redirect
                sign-request: false
              verification:
                credentials:
                  - certificate-location: classpath:saml/samlmock-idp.crt

server:
  port: ${SERVER_PORT}

tf:
  catalogue:
    base-url: ${BASE_URL}
  crypto:
    master-key: ${TF_MASTER_KEY}
    master-key-id: master-v1
    device-key-min-bits: 2048
  security:
    jwt:
      issuer: tf-reader
      secret: ${TF_JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 12h

tnf:
  seed:
    enabled: true
  auth:
    jwt:
      secret: ${TNF_JWT_SECRET}
      ttl: 1h
    oidc:
      client-id: ${OIDC_CLIENT_ID}
      client-secret: ${OIDC_CLIENT_SECRET}
      issuer: ${OIDC_ISSUER}
      authorization-uri: ${OIDC_AUTHORIZATION_URI}
      token-uri: ${OIDC_TOKEN_URI}
      jwk-set-uri: ${OIDC_JWK_SET_URI}
      redirect-uri: ${OIDC_REDIRECT_URI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  health:
    redis:
      enabled: false


mock-oidc:
  enabled: false
  
---
spring:
  config:
    activate:
      on-profile: b2c

# Belt and braces: the mock is already false by default, and stating it here
# means "b2c" switches it off even if the profile list also carries "local".
mock-oidc:
  enabled: false